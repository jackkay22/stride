<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stride — Reset password</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo-mark">S</div>
      <h1>Stride <span class="tag">Self-Service</span></h1>
    </div>
  </header>

  <h2 class="page-title">Set a new password</h2>
  <p class="lede">You followed a password reset link from your email. Choose a new password below.</p>

  <div class="card" style="max-width:420px;">
    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required />
      <div class="hint">At least 8 characters.</div>
      <div style="margin-top:20px;">
        <button type="submit" class="btn" id="reset-submit">Set password</button>
      </div>
    </form>
    <div id="reset-msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<script>
const msgEl = document.getElementById('reset-msg');
function showMsg(text, kind) {
  msgEl.innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : '';
}

let readyForReset = false;
sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') readyForReset = true;
});

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submit = document.getElementById('reset-submit');
  submit.disabled = true;
  const password = document.getElementById('password').value;
  try {
    if (!readyForReset) {
      // Supabase may have already processed the recovery link into a session
      // before onAuthStateChange was wired up — updateUser still works as
      // long as there's a session at all, recovery or otherwise.
      const session = await getSession();
      if (!session) throw new Error('This reset link has expired — request a new one from the sign-in page.');
    }
    const { error } = await sb.auth.updateUser({ password });
    if (error) throw error;
    showMsg('Password updated — you can sign in with it now.', 'ok');
    setTimeout(() => { window.location.href = './index.html'; }, 1500);
  } catch (err) {
    showMsg(err.message, 'error');
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>
