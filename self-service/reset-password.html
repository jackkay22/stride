<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stride — Reset password</title>
<meta name="theme-color" content="#0a1120" />
<meta name="robots" content="noindex" />
<link rel="manifest" href="./manifest.webmanifest" />
<!-- Brand assets are shared with the personal app one level up, so the logo
     only ever needs changing in one place. -->
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="../icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stride" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo-mark" role="img" aria-label="Stride">
        <!-- The Stride S — see brand/stride-mark.svg -->
        <svg width="24" height="24" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M34 16 A 9.5 9.5 0 1 0 24 24 A 9.5 9.5 0 1 1 14 32" stroke="#6f9ff2" stroke-width="4.6" stroke-linecap="round" fill="none"></path>
        </svg>
      </div>
      <h1>Stride <span class="tag">Self-Service</span></h1>
    </div>
  </header>

  <h2 class="page-title">Set a new password</h2>
  <p class="lede">You followed a password reset link from your email. Choose a new password below.</p>

  <div class="card" style="max-width:420px;">
    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required />
      <div class="hint">At least 8 characters.</div>
      <div style="margin-top:20px;">
        <button type="submit" class="btn primary" id="reset-submit">Set password</button>
      </div>
    </form>
    <div id="reset-msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Cache-busted the same way passcode.js is — see index.html for why. -->
<script>document.write('<scr' + 'ipt src="./config.js?v=' + Date.now() + '"></scr' + 'ipt>');</script>
<script src="./app.js"></script>
<script>
const msgEl = document.getElementById('reset-msg');
function showMsg(text, kind) {
  msgEl.innerHTML = '';
  if (!text) return;
  const div = document.createElement('div');
  div.className = `msg ${kind}`;
  div.textContent = text; // error text can come from Supabase — don't render it as HTML
  msgEl.appendChild(div);
}

let readyForReset = false;
sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') readyForReset = true;
});

// Tell the user up front if they've landed here without a usable recovery
// link, rather than letting them type a new password and only then fail.
// supabase-js processes the link's token asynchronously on load, so give it
// a moment before deciding nothing arrived.
(async () => {
  await new Promise((r) => setTimeout(r, 600));
  if (readyForReset) return;
  const session = await getSession();
  if (!session) {
    showMsg(
      'This page only works from the link in a password reset email, and that link expires after a short while. Request a fresh one from the sign-in page.',
      'info'
    );
  }
})();

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submit = document.getElementById('reset-submit');
  submit.disabled = true;
  const password = document.getElementById('password').value;
  try {
    if (!readyForReset) {
      // Supabase may have already processed the recovery link into a session
      // before onAuthStateChange was wired up — updateUser still works as
      // long as there's a session at all, recovery or otherwise.
      const session = await getSession();
      if (!session) throw new Error('This reset link has expired — request a new one from the sign-in page.');
    }
    const { error } = await sb.auth.updateUser({ password });
    if (error) throw error;
    showMsg('Password updated — you can sign in with it now.', 'ok');
    setTimeout(() => { window.location.href = './index.html'; }, 1500);
  } catch (err) {
    showMsg(err.message, 'error');
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>
